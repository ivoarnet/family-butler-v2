<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Family coin">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#E09A12"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#F5B82E"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6CC"/>
      <stop offset="1" stop-color="#E8A317"/>
    </linearGradient>
  </defs>
  <!-- outer rim -->
  <circle cx="64" cy="64" r="60" fill="url(#rim)" stroke="#B87400" stroke-width="3"/>
  <!-- inner face -->
  <circle cx="64" cy="64" r="49" fill="url(#face)" stroke="#D18A0A" stroke-width="2.5"/>
  <!-- star -->
  <polygon points="64,36 71.35,55.89 92.53,56.73 75.89,69.86 81.63,90.27 64,78.5 46.37,90.27 52.11,69.86 35.47,56.73 56.65,55.89"
           fill="url(#star)" stroke="#B87400" stroke-width="3" stroke-linejoin="round"/>
  <!-- shine -->
  <path d="M26 50 A42 42 0 0 1 52 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
</svg>
